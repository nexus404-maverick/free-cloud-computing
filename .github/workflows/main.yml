name: Main RDP Workflow

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Order Code'
        required: true
        type: string
      hours:
        description: 'Rental hours (1-5)'
        required: true
        default: '1'
        type: string
      order_code:
        description: 'Order Code (same as instance_number)'
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  deploy-rdp:
    runs-on: windows-2025
    timeout-minutes: 330

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: System Information
        shell: powershell
        run: |
          Write-Host "=== HIEPDEV CLOUD PC ===" -ForegroundColor Green
          Write-Host "Order: ${{ github.event.inputs.order_code }}" -ForegroundColor Yellow
          Write-Host "Hours: ${{ github.event.inputs.hours }}" -ForegroundColor Yellow
          Get-ComputerInfo | Select-Object WindowsProductName, OsArchitecture

      # ============================================================
      # ENABLE RDP
      # ============================================================
      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 1
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Write-Host "RDP enabled." -ForegroundColor Green

      # ============================================================
      # CREATE USER
      # ============================================================
      - name: Create User
        shell: powershell
        run: |
          $Username = "Layer7Store"
          $Password = ConvertTo-SecureString "P@ssw0rd!" -AsPlainText -Force
          $User = Get-LocalUser -Name $Username -ErrorAction SilentlyContinue
          if ($null -eq $User) {
              New-LocalUser -Name $Username -Password $Password -PasswordNeverExpires -AccountNeverExpires -FullName "Layer7 Store"
          } else {
              Set-LocalUser -Name $Username -Password $Password
          }
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $Username -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member $Username -ErrorAction SilentlyContinue
          Write-Host "User: $Username / Password: P@ssw0rd!" -ForegroundColor Green

      # ============================================================
      # INSTALL CHROME (nhanh)
      # ============================================================
      - name: Install Chrome
        shell: powershell
        timeout-minutes: 3
        run: |
          Write-Host "Installing Chrome..." -ForegroundColor Cyan
          $chromeUrl = "https://dl.google.com/chrome/install/latest/chrome_installer.exe"
          $installerPath = "$env:TEMP\chrome_installer.exe"
          Invoke-WebRequest -Uri $chromeUrl -OutFile $installerPath -UseBasicParsing
          Start-Process -FilePath $installerPath -ArgumentList "/silent /install" -Wait -NoNewWindow
          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue
          Write-Host "Chrome installed." -ForegroundColor Green

      # ============================================================
      # INSTALL RUSTDESK (nhanh nhất)
      # ============================================================
      - name: Install RustDesk
        shell: powershell
        timeout-minutes: 3
        run: |
          Write-Host "=== Installing RustDesk ===" -ForegroundColor Cyan
          $rustdeskUrl = "https://github.com/rustdesk/rustdesk/releases/download/1.3.7/rustdesk-1.3.7-x86_64.exe"
          $rustdeskInstaller = "$env:TEMP\rustdesk-installer.exe"

          Invoke-WebRequest -Uri $rustdeskUrl -OutFile $rustdeskInstaller -UseBasicParsing
          Add-MpPreference -ExclusionPath "$env:TEMP" -ErrorAction SilentlyContinue

          Write-Host "Silent install (non-blocking)..."
          Start-Process -FilePath $rustdeskInstaller -ArgumentList "--silent-install" -WindowStyle Hidden | Out-Null

          $elapsed = 0
          while ($elapsed -lt 90) {
              Start-Sleep -Seconds 5
              $elapsed += 5
              if (Test-Path "C:\Program Files\RustDesk\rustdesk.exe") {
                  Write-Host "RustDesk found at ${elapsed}s." -ForegroundColor Green
                  break
              }
          }

          Get
