name: XyDesk Remote (RDP via Serveo + RustDesk Failover)

on:
  workflow_dispatch:

jobs:
  xydesk-host:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run XyDesk Host Configuration
        shell: powershell
        run: |
          $ErrorActionPreference = "SilentlyContinue"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fSingleSessionPerUser" -Value 0
          
          $tsPolicy = "HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services"
          if (!(Test-Path $tsPolicy)) { New-Item -Path $tsPolicy -Force | Out-Null }
          New-ItemProperty -Path $tsPolicy -Name "fDenyTSConnections" -PropertyType DWord -Value 0 -Force | Out-Null
          New-ItemProperty -Path $tsPolicy -Name "fSingleSessionPerUser" -PropertyType DWord -Value 0 -Force | Out-Null
          New-ItemProperty -Path $tsPolicy -Name "AVC444ModePreferred" -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $tsPolicy -Name "AVCHardwareEncodePreferred" -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $tsPolicy -Name "fAllowDesktopComposition" -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $tsPolicy -Name "fDisableAudio" -PropertyType DWord -Value 0 -Force | Out-Null
          New-ItemProperty -Path $tsPolicy -Name "fDisableAudioCapture" -PropertyType DWord -Value 0 -Force | Out-Null
          
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          netsh advfirewall firewall add rule name="RDP-Allow" dir=in action=allow protocol=TCP localport=3389 | Out-Null
          
          Set-Service -Name "AudioEndpointBuilder" -StartupType Automatic
          Start-Service -Name "AudioEndpointBuilder" -ErrorAction SilentlyContinue
          Set-Service -Name "Audiosrv" -StartupType Automatic
          Start-Service -Name "Audiosrv" -ErrorAction SilentlyContinue
          Restart-Service TermService -Force
          Write-Host "XyDesk Host Ready."

      - name: Create RDP User
        shell: powershell
        run: |
          try {
              $seceditFile = "$env:TEMP\secpol.inf"
              $seceditContent = @("[Unicode]", "Unicode=yes", "[System Access]", "PasswordComplexity = 0", "MinimumPasswordLength = 0")
              Set-Content -Path $seceditFile -Value $seceditContent -Encoding Unicode
              $null = secedit /configure /db "$env:TEMP\secpol.sdb" /cfg $seceditFile /areas SECURITYPOLICY 2>&1
              Remove-Item $seceditFile -Force -ErrorAction SilentlyContinue

              $pin = -join ((48..57) + (65..90) + (97..122) | Get-Random -Count 10 | % {[char]$_})
              $securePass = ConvertTo-SecureString $pin -AsPlainText -Force
              $null = New-LocalUser -Name "XyDesk" -Password $securePass -AccountNeverExpires -PasswordNeverExpires -ErrorAction SilentlyContinue
              $null = Add-LocalGroupMember -Group "Administrators" -Member "XyDesk" -ErrorAction SilentlyContinue
              $null = Add-LocalGroupMember -Group "Remote Desktop Users" -Member "XyDesk" -ErrorAction SilentlyContinue
              
              "RDP_PIN=$pin" >> $env:GITHUB_ENV
              Write-Host "User XyDesk created."
          } catch { Write-Host "Warning: $_" }
          exit 0

      - name: Start Serveo Tunnel (Priority 1)
        shell: powershell
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Continue'
          $sshLog = "$env:TEMP\serveo.log"
          Remove-Item $sshLog -Force -ErrorAction SilentlyContinue
          
          Write-Host "Starting Serveo Tunnel..."
          $cmd = "ssh -tt -o StrictHostKeyChecking=no -R 0:localhost:3389 serveo.net > `"$sshLog`" 2>&1"
          $proc = Start-Process -FilePath "cmd.exe" -ArgumentList "/c", $cmd -WindowStyle Hidden -PassThru

          Write-Host "Waiting for Serveo..."
          $publicHost = $null
          $publicPort = $null
          
          for ($i = 1; $i -le 30; $i++) {
              Start-Sleep -Seconds 2
              if (Test-Path $sshLog) {
                  $content = Get-Content $sshLog -Raw -ErrorAction SilentlyContinue
                  if ($content -match 'from\s+([a-zA-Z0-9\.\-]+):(\d+)') {
                      $publicHost = $matches[1]
                      $publicPort = $matches[2]
                      break
                  }
              }
          }
          
          if ($publicHost -and $publicPort) {
              "RDP_HOST=$publicHost" >> $env:GITHUB_ENV
              "RDP_PORT=$publicPort" >> $env:GITHUB_ENV
              Write-Host "Tunnel Established: $publicHost on port $publicPort"
          } else {
              if (Test-Path $sshLog) { Get-Content $sshLog }
              throw "Tunnel failed."
          }
          exit 0

      # ============================================================
      # CÀI RUSTDESK DỰ PHÒNG (Bỏ qua lỗi nếu không lấy được ID)
      # ============================================================
      - name: Install RustDesk (Priority 2 - Failover)
        shell: powershell
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Continue'
          $installer = "$env:TEMP\rustdesk.exe"
          
          Write-Host "Downloading RustDesk 1.5.0..."
          Invoke-WebRequest -Uri "https://github.com/rustdesk/rustdesk/releases/download/1.5.0/rustdesk-1.5.0-x86_64.exe" -OutFile $installer -UseBasicParsing
          
          Write-Host "Starting silent install..."
          Start-Process -FilePath $installer -ArgumentList "--silent-install"
          Start-Sleep -Seconds 15
          
          Write-Host "Killing GUI to prevent hang..."
          Stop-Process -Name "rustdesk" -Force -ErrorAction SilentlyContinue
          Stop-Process -Name "rustdesk-installer" -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

          $rustdeskExe = "$env:ProgramFiles\RustDesk\rustdesk.exe"
          if (-not (Test-Path $rustdeskExe)) {
              $rustdeskExe = Get-ChildItem "$env:ProgramFiles","${env:ProgramFiles(x86)}" -Filter rustdesk.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName -First 1
          }
          if (-not $rustdeskExe) { 
              Write-Host "RustDesk installation failed. Skipping Failover." -ForegroundColor Yellow
              exit 0 
          }
          
          Write-Host "Installing RustDesk Service..."
          Start-Process -FilePath $rustdeskExe -ArgumentList '--install-service'
          Start-Sleep -Seconds 10
          
          Write-Host "Starting RustDesk Service..."
          $null = sc.exe start RustDesk
          Start-Sleep -Seconds 10
          
          Write-Host "Setting RustDesk Password..."
          Start-Process -FilePath $rustdeskExe -ArgumentList "--password `"$env:RDP_PIN`"" -Wait
          Start-Sleep -Seconds 5

          Write-Host "Getting RustDesk ID (Trying CLI)..."
          $rustdeskId = $null
          
          # Đường dẫn file cấu hình
          $configPaths = @(
            "C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk\config\RustDesk.toml",
            "C:\Windows\System32\config\systemprofile\AppData\Roaming\RustDesk\config\RustDesk.toml",
            "$env:APPDATA\RustDesk\config\RustDesk.toml"
          )

          for ($i = 1; $i -le 10 -and -not $rustdeskId; $i++) {
            $idOutput = @(& $rustdeskExe --get-id 2>&1)
            foreach ($line in $idOutput) {
              if (([string]$line).Trim() -match '^\d{6,20}$') { $rustdeskId = $matches[0]; break }
            }
            
            # Nếu CLI thất bại, đọc file config
            if (-not $rustdeskId) {
                foreach ($path in $configPaths) {
                    if (Test-Path $path) {
                        $content = Get-Content $path -Raw -ErrorAction SilentlyContinue
                        if ($content -match 'id\s*=\s*"(\d{6,20})"') {
                            $rustdeskId = $matches[1]
                            break
                        }
                    }
                }
            }
            
            if (-not $rustdeskId) { Start-Sleep -Seconds 3 }
          }
          
          if ($rustdeskId) {
              Write-Host "RustDesk ID obtained: $rustdeskId"
              "RUSTDESK_ID=$rustdeskId" >> $env:GITHUB_ENV
          } else {
              Write-Host "Failed to get RustDesk ID. Fallback to Serveo only." -ForegroundColor Yellow
              "RUSTDESK_ID=NOT_FOUND" >> $env:GITHUB_ENV
          }
          # Ép buộc thành công để workflow không bị dừng
          exit 0

      - name: Publish Connection Details
        shell: powershell
        run: |
          $rustdeskStatus = if ($env:RUSTDESK_ID -eq "NOT_FOUND" -or [string]::IsNullOrEmpty($env:RUSTDESK_ID)) { "Lỗi (Không lấy được ID)" } else { $env:RUSTDESK_ID }
          
          $summary = @(
            '## 🖥️ XyDesk Remote (RDP + RustDesk Failover)',
            '',
            '### 🚀 Phương án 1: RDP qua Serveo (Dùng ngay)',
            '- **ID (Host):** `' + $env:RDP_HOST + '`',
            '- **Port:** `' + $env:RDP_PORT + '`',
            '- **Username:** `XyDesk`',
            '- **PIN (Password):** `' + $env:RDP_PIN + '`',
            '',
            '### 🛡️ Phương án 2: RustDesk (Dùng khi Serveo sập)',
            '- **RustDesk ID:** `' + $rustdeskStatus + '`',
            '- **Password:** `' + $env:RDP_PIN + '`',
            '',
            '**Hướng dẫn:**',
            '1. Dùng app RDP (mstsc/aRDP) kết nối theo Phương án 1 để vào máy ngay.',
            '2. Khi RDP bị ngắt (sau ~10 phút), mở app RustDesk và kết nối theo Phương án 2 (nếu có ID).',
            '3. Nếu RustDesk báo lỗi ID, bạn hãy chạy lại workflow để lấy phiên mới.'
          )
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Keep session alive
        shell: powershell
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] Session Active..."
              Start-Sleep -Seconds 300
          }
