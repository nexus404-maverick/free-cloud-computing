name: Main RDP Workflow

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Order Code'
        required: true
        type: string
      hours:
        description: 'Rental hours (1-5)'
        required: true
        default: '1'
        type: string
      order_code:
        description: 'Order Code (same as instance_number)'
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  deploy-rdp:
    runs-on: windows-2025
    timeout-minutes: 330

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: System Information
        shell: powershell
        run: |
          Write-Host "=== HIEPDEV CLOUD PC ===" -ForegroundColor Green
          Write-Host "Order: ${{ github.event.inputs.order_code }}" -ForegroundColor Yellow
          Write-Host "Hours: ${{ github.event.inputs.hours }}" -ForegroundColor Yellow
          Get-ComputerInfo | Select-Object WindowsProductName, OsArchitecture

      # ============================================================
      # ENABLE RDP
      # ============================================================
      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 1
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Write-Host "RDP enabled." -ForegroundColor Green

      # ============================================================
      # CREATE USER
      # ============================================================
      - name: Create User
        shell: powershell
        run: |
          $Username = "Layer7Store"
          $Password = ConvertTo-SecureString "P@ssw0rd!" -AsPlainText -Force
          $User = Get-LocalUser -Name $Username -ErrorAction SilentlyContinue
          if ($null -eq $User) {
              New-LocalUser -Name $Username -Password $Password -PasswordNeverExpires -AccountNeverExpires -FullName "Layer7 Store"
          } else {
              Set-LocalUser -Name $Username -Password $Password
          }
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $Username -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member $Username -ErrorAction SilentlyContinue
          Write-Host "User: $Username / Password: P@ssw0rd!" -ForegroundColor Green

      # ============================================================
      # INSTALL CHROME (nhanh)
      # ============================================================
      - name: Install Chrome
        shell: powershell
        timeout-minutes: 3
        run: |
          Write-Host "Installing Chrome..." -ForegroundColor Cyan
          $chromeUrl = "https://dl.google.com/chrome/install/latest/chrome_installer.exe"
          $installerPath = "$env:TEMP\chrome_installer.exe"
          Invoke-WebRequest -Uri $chromeUrl -OutFile $installerPath -UseBasicParsing
          Start-Process -FilePath $installerPath -ArgumentList "/silent /install" -Wait -NoNewWindow
          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue
          Write-Host "Chrome installed." -ForegroundColor Green

      # ============================================================
      # INSTALL RUSTDESK (nhanh nhất)
      # ============================================================
      - name: Install RustDesk
        shell: powershell
        timeout-minutes: 3
        run: |
          Write-Host "=== Installing RustDesk ===" -ForegroundColor Cyan
          $rustdeskUrl = "https://github.com/rustdesk/rustdesk/releases/download/1.3.7/rustdesk-1.3.7-x86_64.exe"
          $rustdeskInstaller = "$env:TEMP\rustdesk-installer.exe"

          Invoke-WebRequest -Uri $rustdeskUrl -OutFile $rustdeskInstaller -UseBasicParsing
          Add-MpPreference -ExclusionPath "$env:TEMP" -ErrorAction SilentlyContinue

          Write-Host "Silent install (non-blocking)..."
          Start-Process -FilePath $rustdeskInstaller -ArgumentList "--silent-install" -WindowStyle Hidden | Out-Null

          $elapsed = 0
          while ($elapsed -lt 90) {
              Start-Sleep -Seconds 5
              $elapsed += 5
              if (Test-Path "C:\Program Files\RustDesk\rustdesk.exe") {
                  Write-Host "RustDesk found at ${elapsed}s." -ForegroundColor Green
                  break
              }
          }

          Get-Process -Name "rustdesk" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Get-Process -Name "rustdesk-installer" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          $rustdeskExe = "C:\Program Files\RustDesk\rustdesk.exe"
          if (-not (Test-Path $rustdeskExe)) {
              Write-Error "RustDesk install failed."
              exit 1
          }

          Add-MpPreference -ExclusionPath "C:\Program Files\RustDesk" -ErrorAction SilentlyContinue
          Remove-Item $rustdeskInstaller -Force -ErrorAction SilentlyContinue

      - name: Configure RustDesk
        shell: powershell
        timeout-minutes: 3
        run: |
          $rustdeskExe = "C:\Program Files\RustDesk\rustdesk.exe"
          $Password = "P@ssw0rd!"

          & $rustdeskExe --install-service
          Start-Sleep -Seconds 10

          $svc = Get-Service -Name "RustDesk" -ErrorAction SilentlyContinue
          if ($svc -and $svc.Status -ne "Running") {
              Start-Service -Name "RustDesk"
              Start-Sleep -Seconds 5
          }

          & $rustdeskExe --password $Password
          Start-Sleep -Seconds 5

          Write-Host "RustDesk service: $((Get-Service -Name RustDesk -ErrorAction SilentlyContinue).Status)" -ForegroundColor Green

      - name: Get RustDesk ID
        shell: powershell
        id: get_id
        run: |
          $rustdeskExe = "C:\Program Files\RustDesk\rustdesk.exe"
          $rustdeskId = $null

          for ($i = 1; $i -le 10; $i++) {
              try {
                  $output = & $rustdeskExe --get-id 2>&1 | Out-String
                  if ($output -match "(\d{9,10})") {
                      $rustdeskId = $matches[1]
                      break
                  }
              } catch { }
              Start-Sleep -Seconds 3
          }

          if (-not $rustdeskId) {
              $configPaths = @(
                  "C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk\config\RustDesk.toml",
                  "$env:APPDATA\RustDesk\config\RustDesk.toml",
                  "C:\Windows\System32\config\systemprofile\AppData\Roaming\RustDesk\config\RustDesk.toml"
              )
              foreach ($path in $configPaths) {
                  if (Test-Path $path) {
                      $content = Get-Content $path -Raw
                      if ($content -match 'id\s*=\s*"(\d+)"') {
                          $rustdeskId = $matches[1]
                          break
                      }
                  }
              }
          }

          if (-not $rustdeskId) {
              Write-Error "Cannot get RustDesk ID"
              exit 1
          }

          Write-Host "RustDesk ID: $rustdeskId" -ForegroundColor Green
          "RUSTDESK_ID=$rustdeskId" >> $env:GITHUB_ENV
          "RUSTDESK_ID=$rustdeskId" >> $env:GITHUB_OUTPUT

      # ============================================================
      # BÁO VỀ WEB: PROVISION COMPLETE
      # ============================================================
      - name: Notify Web Backend
        shell: powershell
        env:
          PROVISION_SECRET: ${{ secrets.PROVISION_SECRET }}
          WEB_URL: ${{ secrets.WEB_URL }}
        run: |
          $orderCode = "${{ github.event.inputs.order_code }}"
          $rustdeskId = $env:RUSTDESK_ID

          Write-Host "Notifying web: $WEB_URL/api/order/$orderCode/provision" -ForegroundColor Cyan

          $body = @{
              rustdesk_id       = $rustdeskId
              rustdesk_password = "P@ssw0rd!"
              secret            = $env:PROVISION_SECRET
          } | ConvertTo-Json

          try {
              $response = Invoke-RestMethod `
                  -Uri "$env:WEB_URL/api/order/$orderCode/provision" `
                  -Method Post `
                  -Body $body `
                  -ContentType "application/json" `
                  -TimeoutSec 30
              Write-Host "Backend notified: $($response | ConvertTo-Json)" -ForegroundColor Green
          } catch {
              Write-Host "Failed to notify backend: $_" -ForegroundColor Red
              Write-Host "Workflow continues anyway..." -ForegroundColor Yellow
          }

      # ============================================================
      # KEEP ALIVE (5 giờ + trigger backup)
      # ============================================================
      - name: Keep Session Alive
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          $instance      = "${{ github.event.inputs.instance_number }}"
          $repo          = "${{ github.repository }}"
          $ref           = "${{ github.ref_name }}"
          $hours         = [int]"${{ github.event.inputs.hours }}"
          $sleepSeconds  = 60

          $triggerBackup = (Get-Date).AddMinutes($hours * 60 - 5)
          $endSession    = (Get-Date).AddMinutes($hours * 60 + 10)
          $counter       = 0

          Write-Host "=== SESSION STARTED ===" -ForegroundColor Green
          Write-Host "Rental: $hours hours" -ForegroundColor Yellow
          Write-Host "RustDesk ID: $env:RUSTDESK_ID" -ForegroundColor Cyan
          Write-Host "Password: P@ssw0rd!" -ForegroundColor Cyan

          while ($true) {
              $counter++
              $now = Get-Date

              Write-Host ""
              Write-Host "=== Heartbeat #$counter - $now ===" -ForegroundColor Cyan
              Write-Host "Order: $instance | Hours: $hours" -ForegroundColor Yellow

              $svc = Get-Service -Name "RustDesk" -ErrorAction SilentlyContinue
              if ($svc -and $svc.Status -eq "Running") {
                  Write-Host "RustDesk: RUNNING" -ForegroundColor Green
              } else {
                  Write-Host "RustDesk: NOT RUNNING - restarting..." -ForegroundColor Red
                  Start-Service -Name "RustDesk" -ErrorAction SilentlyContinue
              }

              if ($now -ge $triggerBackup) {
                  Write-Host "*** Triggering backup ***" -ForegroundColor Yellow
                  $success = $false
                  for ($i = 1; $i -le 3; $i++) {
                      gh workflow run backup.yml --repo $repo --ref $ref -f "instance_number=$instance"
                      if ($LASTEXITCODE -eq 0) { $success = $true; break }
                      Start-Sleep -Seconds 10
                  }
                  if ($success) {
                      $triggerBackup = (Get-Date).AddYears(1)
                      Write-Host "Backup triggered." -ForegroundColor Green
                  } else {
                      Start-Sleep -Seconds 60
                      continue
                  }
              }

              if ($now -ge $endSession) {
                  Write-Host "Session ended." -ForegroundColor Yellow
                  exit 0
              }

              Start-Sleep -Seconds $sleepSeconds
          }
