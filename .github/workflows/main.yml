name: Provision Cloud PC

on:
  workflow_dispatch:
    inputs:
      instance_number: # Đổi từ node_id thành instance_number
        description: 'ID của Repo/Máy ảo'
        required: true
        type: string
      hours:
        description: 'Số giờ thuê (1-5)'
        required: true
        default: '3'
        type: string

permissions:
  actions: write
  contents: read

jobs:
  deploy-instance:
    runs-on: windows-2025
    timeout-minutes: 330

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Generate Random Password
        id: gen_pass
        shell: powershell
        run: |
          # CHỈ DÙNG CHỮ VÀ SỐ ĐỂ TRÁNH LỖI TRUYỀN THAM SỐ
          $chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
          $password = -join (1..12 | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
          echo "GENERATED_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Enable RDP (Dự phòng)
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 1
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

      - name: Create User
        shell: powershell
        run: |
          $Username = "Layer7Store"
          $Password = ConvertTo-SecureString "$env:GENERATED_PASSWORD" -AsPlainText -Force
          $User = Get-LocalUser -Name $Username -ErrorAction SilentlyContinue
          if ($null -eq $User) {
              New-LocalUser -Name $Username -Password $Password -PasswordNeverExpires -AccountNeverExpires -FullName "Layer7 Store"
          } else {
              Set-LocalUser -Name $Username -Password $Password
          }
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $Username -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member $Username -ErrorAction SilentlyContinue

      - name: Install RustDesk
        shell: powershell
        timeout-minutes: 3
        run: |
          Write-Host "Installing RustDesk..." -ForegroundColor Cyan
          $rustdeskUrl = "https://github.com/rustdesk/rustdesk/releases/download/1.3.7/rustdesk-1.3.7-x86_64.exe"
          $installer = "$env:TEMP\rustdesk.exe"
          Invoke-WebRequest -Uri $rustdeskUrl -OutFile $installer -UseBasicParsing
          
          Start-Process -FilePath $installer -ArgumentList "--silent-install" -WindowStyle Hidden | Out-Null
          
          # Đợi file cài đặt xuất hiện
          $elapsed = 0
          while ($elapsed -lt 60 -and -not (Test-Path "C:\Program Files\RustDesk\rustdesk.exe")) {
              Start-Sleep -Seconds 5
              $elapsed += 5
          }
          
          # Đảm bảo service chạy
          & "C:\Program Files\RustDesk\rustdesk.exe" --install-service
          
          # CHỜ 15 GIÂY ĐỂ SERVICE KHỞI ĐỘNG HOÀN TOÀN TRƯỚC KHI SET PASS
          Write-Host "Đợi RustDesk service ổn định..." -ForegroundColor Yellow
          Start-Sleep -Seconds 15
          Start-Service -Name "RustDesk" -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5

      - name: Set RustDesk Password and Get ID
        shell: powershell
        run: |
          $rustdeskExe = "C:\Program Files\RustDesk\rustdesk.exe"
          
          Write-Host "Đang set mật khẩu: $env:GENERATED_PASSWORD" -ForegroundColor Cyan
          # Set pass 2 lần để chắc chắn nó ghi đè thành công
          & $rustdeskExe --password "$env:GENERATED_PASSWORD"
          Start-Sleep -Seconds 3
          & $rustdeskExe --password "$env:GENERATED_PASSWORD"
          Start-Sleep -Seconds 5
          
          # Lấy ID
          $rustdeskId = $null
          for ($i = 1; $i -le 10; $i++) {
              try {
                  $output = & $rustdeskExe --get-id 2>&1 | Out-String
                  if ($output -match "(\d{9,10})") {
                      $rustdeskId = $matches[1]
                      break
                  }
              } catch {}
              Start-Sleep -Seconds 3
          }
          
          if (-not $rustdeskId) {
              $configPath = "C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk\config\RustDesk.toml"
              if (Test-Path $configPath) {
                  $content = Get-Content $configPath -Raw
                  if ($content -match 'id\s*=\s*"(\d+)"') { $rustdeskId = $matches[1] }
              }
          }
          
          if ($rustdeskId) {
              echo "RUSTDESK_ID=$rustdeskId" >> $env:GITHUB_ENV
              Write-Host "✅ ID: $rustdeskId" -ForegroundColor Green
          } else {
              Write-Error "Không thể lấy RustDesk ID"
              exit 1
          }

      - name: Send Credentials to Phone Server
        shell: powershell
        env:
          PHONE_SERVER_URL: ${{ secrets.PHONE_SERVER_URL }}
          PROVISION_SECRET: ${{ secrets.PROVISION_SECRET }}
        run: |
          $nodeId = "${{ github.event.inputs.node_id }}"
          $url = "$env:PHONE_SERVER_URL/api/provision/$nodeId"
          
          $body = @{
              rustdesk_id       = "$env:RUSTDESK_ID"
              rustdesk_password = "$env:GENERATED_PASSWORD"
              secret            = "$env:PROVISION_SECRET"
          } | ConvertTo-Json
          
          try {
              $res = Invoke-RestMethod -Uri $url -Method Post -Body $body -ContentType "application/json" -TimeoutSec 30
              Write-Host "✅ Gửi thành công!" -ForegroundColor Green
          } catch {
              Write-Host "❌ Lỗi gửi thông tin: $_" -ForegroundColor Red
          }

      - name: Keep Session Alive
        shell: powershell
        run: |
          $hours = [int]"${{ github.event.inputs.hours }}"
          $endSession = (Get-Date).AddMinutes($hours * 60)
          
          Write-Host "Phiên làm việc sẽ kết thúc lúc: $endSession" -ForegroundColor Yellow
          
          while ((Get-Date) -lt $endSession) {
              $svc = Get-Service -Name "RustDesk" -ErrorAction SilentlyContinue
              if ($svc -and $svc.Status -ne "Running") {
                  Start-Service -Name "RustDesk" -ErrorAction SilentlyContinue
              }
              Start-Sleep -Seconds 60
          }
          Write-Host "Hết thời gian thuê. Kết thúc phiên." -ForegroundColor Red
