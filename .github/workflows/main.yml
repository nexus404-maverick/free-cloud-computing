name: XyDesk Remote (RDP via localhost.run)

on:
  workflow_dispatch:

jobs:
  xydesk-host:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Windows RDP & User
        shell: powershell
        run: |
          $ErrorActionPreference = "SilentlyContinue"
          try {
              Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
              Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
              Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
              Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fSingleSessionPerUser" -Value 0
              
              Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
              netsh advfirewall firewall add rule name="RDP-Allow" dir=in action=allow protocol=TCP localport=3389 2>&1 | Out-Null
              
              $seceditFile = "$env:TEMP\secpol.inf"
              $seceditContent = @("[Unicode]", "Unicode=yes", "[System Access]", "PasswordComplexity = 0", "MinimumPasswordLength = 0")
              Set-Content -Path $seceditFile -Value $seceditContent -Encoding Unicode
              $null = secedit /configure /db "$env:TEMP\secpol.sdb" /cfg $seceditFile /areas SECURITYPOLICY 2>&1
              Remove-Item $seceditFile -Force -ErrorAction SilentlyContinue

              $password = -join ((48..57) + (65..90) + (97..122) + (33..47) | Get-Random -Count 12 | % {[char]$_})
              
              $securePass = ConvertTo-SecureString $password -AsPlainText -Force
              $null = New-LocalUser -Name "XyDesk" -Password $securePass -AccountNeverExpires -PasswordNeverExpires -ErrorAction SilentlyContinue
              $null = Add-LocalGroupMember -Group "Administrators" -Member "XyDesk" -ErrorAction SilentlyContinue
              $null = Add-LocalGroupMember -Group "Remote Desktop Users" -Member "XyDesk" -ErrorAction SilentlyContinue
              
              "RDP_PASSWORD=$password" >> $env:GITHUB_ENV
              
              Set-Service -Name "AudioEndpointBuilder" -StartupType Automatic
              Start-Service -Name "AudioEndpointBuilder" -ErrorAction SilentlyContinue
              Set-Service -Name "Audiosrv" -StartupType Automatic
              Start-Service -Name "Audiosrv" -ErrorAction SilentlyContinue
              Restart-Service TermService -Force -ErrorAction SilentlyContinue
              
              Write-Host "RDP is Ready."
          } catch {
              Write-Host "Warning during setup: $_"
          }
          exit 0

      - name: Start localhost.run Tunnel & Display Info
        shell: powershell
        timeout-minutes: 360
        run: |
          $ErrorActionPreference = 'Continue'
          $endTime = (Get-Date).AddMinutes(350)
          
          $currentHost = $null
          $currentPort = $null
          $tunnelProc = $null

          function Start-Tunnel {
              if ($script:tunnelProc -and -not $script:tunnelProc.HasExited) {
                  Stop-Process -Id $script:tunnelProc.Id -Force -ErrorAction SilentlyContinue
              }
              Get-Process -Name "ssh" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 2
              
              $sshLog = "$env:TEMP\localhost_run.log"
              Remove-Item $sshLog -Force -ErrorAction SilentlyContinue
              
              # Sử dụng localhost.run thay vì Pinggy
              $cmd = "ssh -T -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -R 0:localhost:3389 nokey@localhost.run > `"$sshLog`" 2>&1"
              $script:tunnelProc = Start-Process -FilePath "cmd.exe" -ArgumentList "/c", $cmd -WindowStyle Hidden -PassThru
              
              Write-Host "Waiting for localhost.run to assign URL..."
              for ($i = 1; $i -le 30; $i++) {
                  Start-Sleep -Seconds 2
                  if (Test-Path $sshLog) {
                      $content = Get-Content $sshLog -Raw -ErrorAction SilentlyContinue
                      # localhost.run cấp link dạng: xxxx.lhr.life
                      if ($content -match '([a-zA-Z0-9\-]+\.lhr\.life)') {
                          $script:currentHost = $matches[1]
                          $script:currentPort = "80" # localhost.run tự map port 80 tới port đích
                          Write-Host "=================================================="
                          Write-Host "NEW ADDRESS: $($script:currentHost)" -ForegroundColor Green
                          Write-Host "=================================================="
                          return $true
                      }
                  }
              }
              return $false
          }

          if (-not (Start-Tunnel)) { 
              Write-Host "Cannot create localhost.run tunnel." -ForegroundColor Red
              exit 1 
          }

          $summary = @(
            '## XyDesk Remote (RDP via localhost.run)',
            '',
            '### Connection Details',
            '- **Host (IP):** `' + $currentHost + '`',
            '- **Port:** `3389` (Hoặc để trống nếu app tự nhận)',
            '',
            '- **Username:** `XyDesk`',
            '- **Password:** `' + $env:RDP_PASSWORD + '`',
            '',
            '**Huong dan ket noi:**',
            '1. Mo app RDP (mstsc tren PC, aRDP tren Android).',
            '2. O o Host/PC Name, nhap Host o tren.',
            '3. Nhap Username va Password de ket noi.',
            '',
            '> ⚠️ localhost.run mien phi co the tu dong doi Host sau vai gio.',
            '> Neu ban bi mat ket noi, hay quay lai trang nay de xem thong tin moi nhat trong phan Log.'
          )
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          Write-Host "Summary published to GitHub Actions."

          while ((Get-Date) -lt $endTime) {
              Start-Sleep -Seconds 30
              
              if (-not $script:tunnelProc -or $script:tunnelProc.HasExited) {
                  Write-Host "Tunnel died. Recreating..." -ForegroundColor Yellow
                  if (Start-Tunnel) {
                      Write-Host "NEW ADDRESS GENERATED: $currentHost" -ForegroundColor Cyan
                      Write-Host "Please check the logs if you need to reconnect." -ForegroundColor Cyan
                  }
              } else {
                  $content = Get-Content "$env:TEMP\localhost_run.log" -Raw -ErrorAction SilentlyContinue
                  if ($content -match '([a-zA-Z0-9\-]+\.lhr\.life)') {
                      $newHost = $matches[1]
                      if ($newHost -ne $currentHost) {
                          $currentHost = $newHost
                          Write-Host "=================================================="
                          Write-Host "NEW ADDRESS: $currentHost" -ForegroundColor Green
                          Write-Host "=================================================="
                      }
                  }
              }
          }
