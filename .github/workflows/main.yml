name: Main RDP Workflow

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance Number (1-10)'
        required: true
        default: '1'
        type: string

permissions:
  actions: write
  contents: read

jobs:
  deploy-rdp:
    runs-on: windows-latest
    timeout-minutes: 330

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: System Information
        shell: powershell
        run: |
          Write-Host "=== ENIGMANO RDP DEPLOYMENT ===" -ForegroundColor Green
          Write-Host "Instance Number: ${{ github.event.inputs.instance_number }}" -ForegroundColor Yellow
          Write-Host "Runner: $env:RUNNER_NAME" -ForegroundColor Yellow
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsArchitecture

      - name: Enable RDP
        shell: powershell
        run: |
          Write-Host "Enabling Remote Desktop..." -ForegroundColor Green
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 1
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Write-Host "Remote Desktop enabled." -ForegroundColor Green

      - name: Create User Account
        shell: powershell
        run: |
          Write-Host "Setting up user account..." -ForegroundColor Green
          $Password = ConvertTo-SecureString "P@ssw0rd!" -AsPlainText -Force
          $User = Get-LocalUser -Name "runneradmin" -ErrorAction SilentlyContinue
          if ($null -eq $User) {
              New-LocalUser -Name "runneradmin" -Password $Password -PasswordNeverExpires -AccountNeverExpires
          } else {
              Set-LocalUser -Name "runneradmin" -Password $Password
          }
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin" -ErrorAction SilentlyContinue
          Write-Host "Username: runneradmin / Password: P@ssw0rd!" -ForegroundColor Yellow

      - name: Install Tailscale
        shell: powershell
        run: |
          Write-Host "Downloading Tailscale..." -ForegroundColor Green
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process -FilePath "msiexec.exe" -ArgumentList "/i `"$installerPath`" /quiet /norestart" -Wait -NoNewWindow
          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue
          & "C:\Program Files\Tailscale\tailscale.exe" version

      - name: Generate New Tailscale Auth Key
        shell: powershell
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "=== GENERATING NEW TAILSCALE AUTH KEY ===" -ForegroundColor Cyan

          $tokenBody = @{
              client_id     = $env:TS_OAUTH_CLIENT_ID
              client_secret = $env:TS_OAUTH_SECRET
          }

          try {
              $tokenResp = Invoke-RestMethod -Uri "https://api.tailscale.com/api/v2/oauth/token" -Method Post -Body $tokenBody -ContentType "application/x-www-form-urlencoded"
              Write-Host "OAuth access token obtained." -ForegroundColor Green
          }
          catch {
              Write-Host "LOI LAY TOKEN: $($_.ErrorDetails.Message)" -ForegroundColor Red
              exit 1
          }

          $accessToken = $tokenResp.access_token

          $keyBody = @{
              capabilities = @{
                  devices = @{
                      create = @{
                          reusable      = $true
                          ephemeral     = $true
                          preauthorized = $true
                          tags          = @("tag:github-runner")
                      }
                  }
              }
              expirySeconds = 3600
              description   = "enigmano-run-${{ github.run_id }}"
          } | ConvertTo-Json -Depth 10

          $headers = @{
              "Authorization" = "Bearer $accessToken"
              "Content-Type"  = "application/json"
          }

          try {
              $keyResp = Invoke-RestMethod -Uri "https://api.tailscale.com/api/v2/tailnet/-/keys" -Method Post -Headers $headers -Body $keyBody
              Write-Host "New auth key created: $($keyResp.id)" -ForegroundColor Green
          }
          catch {
              Write-Host "LOI TAO KEY: $($_.ErrorDetails.Message)" -ForegroundColor Red
              exit 1
          }

          "TS_NEW_AUTH_KEY=$($keyResp.key)" >> $env:GITHUB_ENV

      - name: Start Tailscale
        shell: powershell
        run: |
          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"
          $hostname = "enigmano-${{ github.run_id }}"
          & $tailscale up --auth-key="$env:TS_NEW_AUTH_KEY" --hostname="$hostname" --advertise-tags="tag:github-runner"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Start-Sleep -Seconds 10
          Write-Host "Tailscale started successfully." -ForegroundColor Green

      - name: Get Tailscale IP
        shell: powershell
        run: |
          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"
          $tsIP = (& $tailscale ip -4 | Select-Object -First 1).Trim()
          Write-Host "Tailscale IP: $tsIP" -ForegroundColor Green
          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Install Google Chrome
        shell: powershell
        run: |
          $chromeUrl = "https://dl.google.com/chrome/install/latest/chrome_installer.exe"
          $installerPath = "$env:TEMP\chrome_installer.exe"
          Invoke-WebRequest -Uri $chromeUrl -OutFile $installerPath
          Start-Process -FilePath $installerPath -ArgumentList "/silent /install" -Wait -NoNewWindow
          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

      - name: Install 7-Zip
        shell: powershell
        run: |
          $zipUrl = "https://www.7-zip.org/a/7z2409-x64.exe"
          $installerPath = "$env:TEMP\7z-installer.exe"
          Invoke-WebRequest -Uri $zipUrl -OutFile $installerPath
          Start-Process -FilePath $installerPath -ArgumentList "/S" -Wait -NoNewWindow
          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

      - name: Connection Details
        shell: powershell
        run: |
          Write-Host "`n=== CONNECTION DETAILS ===" -ForegroundColor Green
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "Host:     $env:TAILSCALE_IP" -ForegroundColor White
          Write-Host "Username: runneradmin" -ForegroundColor White
          Write-Host "Password: P@ssw0rd!" -ForegroundColor White
          Write-Host "========================================" -ForegroundColor Cyan

      # ============================================================
      # KEEP SESSION ALIVE - TRIGGER BACKUP SAU 4H55M
      # ============================================================
      - name: Keep Session Alive / Trigger Backup
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          $tailscale     = "C:\Program Files\Tailscale\tailscale.exe"
          $instance      = "${{ github.event.inputs.instance_number }}"
          $repo          = "${{ github.repository }}"
          $ref           = "${{ github.ref_name }}"
          $sleepSeconds  = 60
          $triggerBackup = (Get-Date).AddMinutes(295)   # 4h55m = 295 phút
          $endSession    = (Get-Date).AddMinutes(310)   # 5h10m = kết thúc chắc chắn
          $counter       = 0

          Write-Host "=== MAIN WORKFLOW STARTED ===" -ForegroundColor Green
          Write-Host "Will trigger backup.yml at: $triggerBackup" -ForegroundColor Yellow
          Write-Host "Will end session at:         $endSession" -ForegroundColor Yellow

          while ($true) {
              $counter++
              $now = Get-Date

              Write-Host ""
              Write-Host "=== Heartbeat #$counter - $now ===" -ForegroundColor Cyan

              # === Kiểm tra trigger backup ===
              if ($now -ge $triggerBackup) {
                  Write-Host "`n*** TRIGGERING BACKUP WORKFLOW ***" -ForegroundColor Yellow

                  $maxRetries = 3
                  $success = $false

                  for ($i = 1; $i -le $maxRetries; $i++) {
                      Write-Host "Attempt $i of $maxRetries..." -ForegroundColor Yellow

                      gh workflow run backup.yml `
                          --repo $repo `
                          --ref  $ref `
                          -f "instance_number=$instance"

                      if ($LASTEXITCODE -eq 0) {
                          $success = $true
                          break
                      }

                      Write-Host "Attempt $i failed." -ForegroundColor Red
                      if ($i -lt $maxRetries) { Start-Sleep -Seconds 10 }
                  }

                  if ($success) {
                      Write-Host "Backup workflow triggered successfully." -ForegroundColor Green
                  } else {
                      Write-Host "FAILED to trigger backup. Retrying in 60s..." -ForegroundColor Red
                      Start-Sleep -Seconds 60
                      continue
                  }

                  # Đánh dấu đã trigger backup (đổi thời gian để không trigger lại)
                  $triggerBackup = (Get-Date).AddYears(1)
              }

              # === Kết thúc session khi hết giờ ===
              if ($now -ge $endSession) {
                  Write-Host "`n=== SESSION ENDED ===" -ForegroundColor Yellow
                  Write-Host "Logging out Tailscale..." -ForegroundColor Yellow
                  & $tailscale logout 2>$null
                  Start-Sleep -Seconds 3
                  & $tailscale down 2>$null
                  Write-Host "Cleanup complete. Exiting." -ForegroundColor Green
                  exit 0
              }

              # === Kiểm tra Tailscale còn sống ===
              & $tailscale status 2>&1 | Out-Null
              if ($LASTEXITCODE -eq 0) {
                  Write-Host "Tailscale: ACTIVE" -ForegroundColor Green
              } else {
                  Write-Host "Tailscale: DOWN" -ForegroundColor Red
              }

              $remaining = $endSession - $now
              Write-Host ("Session ends in: {0:hh\:mm\:ss}" -f $remaining) -ForegroundColor Yellow

              Start-Sleep -Seconds $sleepSeconds
          }
