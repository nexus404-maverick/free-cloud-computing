name: XyDesk Remote (RDP via Bore)

on:
  workflow_dispatch:

jobs:
  xydesk-host:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Windows RDP & User
        shell: powershell
        run: |
          $ErrorActionPreference = "SilentlyContinue"
          try {
              Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
              Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
              Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
              Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fSingleSessionPerUser" -Value 0
              
              Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
              netsh advfirewall firewall add rule name="RDP-Allow" dir=in action=allow protocol=TCP localport=3389 2>&1 | Out-Null
              
              $seceditFile = "$env:TEMP\secpol.inf"
              $seceditContent = @("[Unicode]", "Unicode=yes", "[System Access]", "PasswordComplexity = 0", "MinimumPasswordLength = 0")
              Set-Content -Path $seceditFile -Value $seceditContent -Encoding Unicode
              $null = secedit /configure /db "$env:TEMP\secpol.sdb" /cfg $seceditFile /areas SECURITYPOLICY 2>&1
              Remove-Item $seceditFile -Force -ErrorAction SilentlyContinue

              $password = -join ((48..57) + (65..90) + (97..122) + (33..47) | Get-Random -Count 12 | % {[char]$_})
              
              $securePass = ConvertTo-SecureString $password -AsPlainText -Force
              $null = New-LocalUser -Name "XyDesk" -Password $securePass -AccountNeverExpires -PasswordNeverExpires -ErrorAction SilentlyContinue
              $null = Add-LocalGroupMember -Group "Administrators" -Member "XyDesk" -ErrorAction SilentlyContinue
              $null = Add-LocalGroupMember -Group "Remote Desktop Users" -Member "XyDesk" -ErrorAction SilentlyContinue
              
              "RDP_PASSWORD=$password" >> $env:GITHUB_ENV
              
              Set-Service -Name "AudioEndpointBuilder" -StartupType Automatic
              Start-Service -Name "AudioEndpointBuilder" -ErrorAction SilentlyContinue
              Set-Service -Name "Audiosrv" -StartupType Automatic
              Start-Service -Name "Audiosrv" -ErrorAction SilentlyContinue
              Restart-Service TermService -Force -ErrorAction SilentlyContinue
              
              Write-Host "RDP is Ready."
          } catch {
              Write-Host "Warning during setup: $_"
          }
          exit 0

      - name: Start Bore Tunnel & Display Info
        shell: powershell
        timeout-minutes: 360
        run: |
          $ErrorActionPreference = 'Continue'
          $endTime = (Get-Date).AddMinutes(350)
          
          $currentHost = "bore.pub"
          $currentPort = $null
          $tunnelProc = $null

          function Start-Tunnel {
              if ($script:tunnelProc -and -not $script:tunnelProc.HasExited) {
                  Stop-Process -Id $script:tunnelProc.Id -Force -ErrorAction SilentlyContinue
              }
              Start-Sleep -Seconds 2
              
              $boreLog = "$env:TEMP\bore.log"
              Remove-Item $boreLog -Force -ErrorAction SilentlyContinue
              
              # Tải Bore
              if (-not (Test-Path "$env:TEMP\bore.exe")) {
                  Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.5.3/bore-v0.5.3-x86_64-pc-windows-msvc.zip" -OutFile "$env:TEMP\bore.zip" -UseBasicParsing
                  Expand-Archive -Path "$env:TEMP\bore.zip" -DestinationPath "$env:TEMP\bore_extract" -Force
                  Move-Item "$env:TEMP\bore_extract\bore.exe" "$env:TEMP\bore.exe" -Force
              }

              Write-Host "Starting Bore tunnel..."
              $script:tunnelProc = Start-Process -FilePath "$env:TEMP\bore.exe" -ArgumentList "local 3389 --to bore.pub" -WindowStyle Hidden -RedirectStandardOutput $boreLog -PassThru
              
              Write-Host "Waiting for Bore to assign port..."
              for ($i = 1; $i -le 30; $i++) {
                  Start-Sleep -Seconds 2
                  if (Test-Path $boreLog) {
                      $content = Get-Content $boreLog -Raw -ErrorAction SilentlyContinue
                      if ($content -match 'listening at (bore\.pub:\d+)') {
                          $script:currentPort = $matches[1] -replace 'bore\.pub:', ''
                          Write-Host "=================================================="
                          Write-Host "NEW ADDRESS: $($script:currentHost):$($script:currentPort)" -ForegroundColor Green
                          Write-Host "=================================================="
                          return $true
                      }
                  }
              }
              return $false
          }

          if (-not (Start-Tunnel)) { 
              Write-Host "Cannot create Bore tunnel. Please restart the workflow." -ForegroundColor Red
              exit 1 
          }

          # KHONG DUNG TIENG VIET CO DAU DE TRANH LOI FONT CHU
          $summary = @(
            '## XyDesk Remote (RDP via Bore.pub)',
            '',
            '### Connection Details',
            '- **Host (IP):** `' + $currentHost + '`',
            '- **Port:** `' + $currentPort + '`',
            '',
            '- **Username:** `XyDesk`',
            '- **Password:** `' + $env:RDP_PASSWORD + '`',
            '',
            '**Huong dan ket noi:**',
            '1. Open RDP app (mstsc on PC, aRDP on Android).',
            '2. In Host/PC Name, enter the Host above.',
            '3. In Port, enter the Port above.',
            '4. Enter Username and Password to connect.',
            '',
            '> ⚠️ Bore is a free community tunnel. If the connection drops, please restart the workflow.'
          )
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          Write-Host "Summary published to GitHub Actions."

          while ((Get-Date) -lt $endTime) {
              Start-Sleep -Seconds 30
              
              if (-not $script:tunnelProc -or $script:tunnelProc.HasExited) {
                  Write-Host "Tunnel died. Recreating..." -ForegroundColor Yellow
                  if (Start-Tunnel) {
                      Write-Host "NEW ADDRESS GENERATED: $currentHost : $currentPort" -ForegroundColor Cyan
                  }
              }
          }
