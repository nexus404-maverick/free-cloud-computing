name: Main RDP Workflow

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance Number (1-10)'
        required: true
        default: '1'
        type: string

permissions:
  actions: write
  contents: read

jobs:
  deploy-rdp:
    runs-on: windows-2025
    timeout-minutes: 330

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: System Information
        shell: powershell
        run: |
          Write-Host "=== LAYER7 STORE RDP ===" -ForegroundColor Green
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsArchitecture

      - name: Enable RDP
        shell: powershell
        run: |
          Write-Host "Enabling RDP..." -ForegroundColor Green
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 1
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Write-Host "RDP enabled." -ForegroundColor Green

      - name: Create User Layer7Store
        shell: powershell
        run: |
          Write-Host "Creating user Layer7Store..." -ForegroundColor Green
          $Username = "Layer7Store"
          $Password = ConvertTo-SecureString "P@ssw0rd!" -AsPlainText -Force
          $User = Get-LocalUser -Name $Username -ErrorAction SilentlyContinue
          if ($null -eq $User) {
              New-LocalUser -Name $Username -Password $Password -PasswordNeverExpires -AccountNeverExpires -FullName "Layer7 Store"
              Write-Host "User created." -ForegroundColor Green
          } else {
              Set-LocalUser -Name $Username -Password $Password
              Write-Host "Password updated." -ForegroundColor Yellow
          }
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $Username -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member $Username -ErrorAction SilentlyContinue
          Write-Host "Username: Layer7Store / Password: P@ssw0rd!" -ForegroundColor Yellow

      - name: Install Bore
        shell: powershell
        run: |
          Write-Host "Downloading Bore..." -ForegroundColor Green
          $boreUrl = "https://github.com/ekzhang/bore/releases/download/v0.5.3/bore-v0.5.3-x86_64-pc-windows-msvc.zip"
          $zipPath = "$env:TEMP\bore.zip"

          try {
              Invoke-WebRequest -Uri $boreUrl -OutFile $zipPath -ErrorAction Stop
          } catch {
              Write-Host "Fallback to v0.5.0..."
              $boreUrl = "https://github.com/ekzhang/bore/releases/download/v0.5.0/bore-v0.5.0-x86_64-pc-windows-msvc.zip"
              Invoke-WebRequest -Uri $boreUrl -OutFile $zipPath
          }

          Write-Host "Extracting..." -ForegroundColor Green
          Expand-Archive -Path $zipPath -DestinationPath "C:\bore" -Force
          Remove-Item $zipPath -Force

          $boreExe = (Get-ChildItem "C:\bore\*.exe" -Recurse | Select-Object -First 1).FullName
          Write-Host "Bore path: $boreExe"

          if (-not (Test-Path $boreExe)) {
              Write-Error "Bore not found."
              exit 1
          }

          # AV exclusion
          Add-MpPreference -ExclusionPath "C:\bore" -ErrorAction SilentlyContinue

          & $boreExe --version

      - name: Install Google Chrome
        shell: powershell
        run: |
          $chromeUrl = "https://dl.google.com/chrome/install/latest/chrome_installer.exe"
          $installerPath = "$env:TEMP\chrome_installer.exe"
          Invoke-WebRequest -Uri $chromeUrl -OutFile $installerPath
          Start-Process -FilePath $installerPath -ArgumentList "/silent /install" -Wait -NoNewWindow
          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

      - name: Install 7-Zip
        shell: powershell
        run: |
          $zipUrl = "https://www.7-zip.org/a/7z2409-x64.exe"
          $installerPath = "$env:TEMP\7z-installer.exe"
          Invoke-WebRequest -Uri $zipUrl -OutFile $installerPath
          Start-Process -FilePath $installerPath -ArgumentList "/S" -Wait -NoNewWindow
          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

      # ============================================================
      # BORE + KEEP ALIVE (gộp chung 1 step)
      # ============================================================
      - name: Bore Tunnel + Keep Session Alive
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          $instance      = "${{ github.event.inputs.instance_number }}"
          $repo          = "${{ github.repository }}"
          $ref           = "${{ github.ref_name }}"
          $sleepSeconds  = 60
          $triggerBackup = (Get-Date).AddMinutes(295)
          $endSession    = (Get-Date).AddMinutes(310)
          $counter       = 0
          $boreExe       = (Get-ChildItem "C:\bore\*.exe" -Recurse | Select-Object -First 1).FullName
          $boreLog       = "$env:TEMP\bore.log"

          # ============================================================
          # START BORE
          # ============================================================
          Write-Host "=== Starting Bore tunnel for RDP (port 3389) ===" -ForegroundColor Green

          Get-Process -Name "bore" -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2

          # Start bore with output redirect
          $boreProc = Start-Process -FilePath $boreExe `
              -ArgumentList "local 3389 --to bore.pub" `
              -PassThru `
              -WindowStyle Hidden `
              -RedirectStandardOutput $boreLog `
              -RedirectStandardError "$env:TEMP\bore-err.log"

          Write-Host "Bore started (PID: $($boreProc.Id))"
          Write-Host "Waiting for tunnel to establish..."
          Start-Sleep -Seconds 15

          # ============================================================
          # LẤY URL TỪ OUTPUT
          # ============================================================
          $publicUrl = $null
          $maxAttempts = 20

          for ($i = 1; $i -le $maxAttempts; $i++) {
              if (Test-Path $boreLog) {
                  $content = Get-Content $boreLog -Raw
                  # Tìm dòng "listening at bore.pub:XXXXX"
                  if ($content -match "listening at (bore\.pub:\d+)") {
                      $publicUrl = $matches[1]
                      break
                  }
              }
              Write-Host "Waiting for Bore... ($i/$maxAttempts)"
              Start-Sleep -Seconds 2
          }

          if (-not $publicUrl) {
              Write-Host "=== BORE LOG ===" -ForegroundColor Red
              if (Test-Path $boreLog) { Get-Content $boreLog | Select-Object -Last 20 }
              if (Test-Path "$env:TEMP\bore-err.log") {
                  Write-Host "=== ERR LOG ===" -ForegroundColor Red
                  Get-Content "$env:TEMP\bore-err.log" | Select-Object -Last 20
              }
              Write-Error "Failed to get Bore URL."
              exit 1
          }

          # ============================================================
          # HIỂN THỊ THÔNG TIN KẾT NỐI
          # ============================================================
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "         LAYER7 STORE RDP ACCESS" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "  ADDRESS:  $publicUrl" -ForegroundColor White
          Write-Host "  USERNAME: Layer7Store" -ForegroundColor White
          Write-Host "  PASSWORD: P@ssw0rd!" -ForegroundColor White
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "  Open mstsc / RD Client" -ForegroundColor Yellow
          Write-Host "  Computer: $publicUrl" -ForegroundColor Yellow
          Write-Host "  User: Layer7Store / Pass: P@ssw0rd!" -ForegroundColor Yellow
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host ""

          # ============================================================
          # KEEP ALIVE LOOP
          # ============================================================
          Write-Host "=== SESSION ACTIVE ===" -ForegroundColor Green

          while ($true) {
              $counter++
              $now = Get-Date

              Write-Host ""
              Write-Host "=== Heartbeat #$counter - $now ===" -ForegroundColor Cyan
              Write-Host "RDP: $publicUrl" -ForegroundColor Cyan

              # Check bore alive
              $proc = Get-Process -Name "bore" -ErrorAction SilentlyContinue
              if ($null -eq $proc) {
                  Write-Host "Bore died! Restarting..." -ForegroundColor Red

                  $boreProc = Start-Process -FilePath $boreExe `
                      -ArgumentList "local 3389 --to bore.pub" `
                      -PassThru `
                      -WindowStyle Hidden `
                      -RedirectStandardOutput $boreLog `
                      -RedirectStandardError "$env:TEMP\bore-err.log"

                  Start-Sleep -Seconds 15

                  # Get new URL
                  if (Test-Path $boreLog) {
                      $content = Get-Content $boreLog -Raw
                      if ($content -match "listening at (bore\.pub:\d+)") {
                          $publicUrl = $matches[1]
                          Write-Host "NEW ADDRESS: $publicUrl" -ForegroundColor Yellow
                          Write-Host "*** NOTE: Reconnect RDP with new address ***" -ForegroundColor Yellow
                      }
                  }
              } else {
                  Write-Host "Bore: RUNNING" -ForegroundColor Green
              }

              # Trigger backup
              if ($now -ge $triggerBackup) {
                  Write-Host ""
                  Write-Host "*** TRIGGERING BACKUP WORKFLOW ***" -ForegroundColor Yellow

                  $success = $false
                  for ($i = 1; $i -le 3; $i++) {
                      gh workflow run backup.yml --repo $repo --ref $ref -f "instance_number=$instance"
                      if ($LASTEXITCODE -eq 0) { $success = $true; break }
                      Start-Sleep -Seconds 10
                  }

                  if ($success) {
                      Write-Host "Backup triggered." -ForegroundColor Green
                      $triggerBackup = (Get-Date).AddYears(1)
                  } else {
                      Start-Sleep -Seconds 60
                      continue
                  }
              }

              # End session
              if ($now -ge $endSession) {
                  Write-Host "Session ended. Cleanup..." -ForegroundColor Yellow
                  Get-Process -Name "bore" -ErrorAction SilentlyContinue | Stop-Process -Force
                  exit 0
              }

              Start-Sleep -Seconds $sleepSeconds
          }
