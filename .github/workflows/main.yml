name: XyDesk Remote (RDP + Pinggy)

on:
  workflow_dispatch:

jobs:
  xydesk-host:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run XyDesk Host Configuration
        shell: powershell
        run: |
          # Chạy script XyDesk tối ưu hóa RDP do bạn cung cấp
          if (Test-Path ".\xydesk-host.ps1") {
              .\xydesk-host.ps1
          } else {
              Write-Error "Không tìm thấy file xydesk-host.ps1 trong repo!"
              exit 1
          }

      - name: Create RDP User (PIN)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Tắt chính sách mật khẩu phức tạp
          $seceditFile = "$env:TEMP\secpol.inf"
          $seceditContent = @("[Unicode]", "Unicode=yes", "[System Access]", "PasswordComplexity = 0", "MinimumPasswordLength = 0")
          Set-Content -Path $seceditFile -Value $seceditContent -Encoding Unicode
          $null = secedit /configure /db "$env:TEMP\secpol.sdb" /cfg $seceditFile /areas SECURITYPOLICY 2>&1
          Remove-Item $seceditFile -Force -ErrorAction SilentlyContinue

          # Tạo mã PIN (Mật khẩu) ngẫu nhiên 10 ký tự
          $pin = -join ((48..57) + (65..90) + (97..122) | Get-Random -Count 10 | % {[char]$_})
          
          # Tạo user "XyDesk"
          $securePass = ConvertTo-SecureString $pin -AsPlainText -Force
          New-LocalUser -Name "XyDesk" -Password $securePass -AccountNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "XyDesk" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "XyDesk" -ErrorAction SilentlyContinue
          
          "RDP_PIN=$pin" >> $env:GITHUB_ENV
          Write-Host "✅ User XyDesk created with PIN."

      - name: Start Pinggy Tunnel & Get ID
        shell: powershell
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Continue'
          $sshLog = "$env:TEMP\pinggy_out.log"
          $sshErr = "$env:TEMP\pinggy_err.log"
          New-Item -ItemType File -Path $sshLog, $sshErr -Force | Out-Null
          
          Write-Host "Starting Pinggy Tunnel..."
          # Sử dụng SSH để mở cổng 3389 ra ngoài
          $proc = Start-Process -FilePath "ssh" -ArgumentList "-p 443 -R0:localhost:3389 -o StrictHostKeyChecking=no a.pinggy.io" -WindowStyle Hidden -RedirectStandardOutput $sshLog -RedirectStandardError $sshErr -PassThru

          Write-Host "Waiting for Pinggy to initialize..."
          $publicHost = $null
          $publicPort = $null
          
          for ($i = 1; $i -le 15; $i++) {
              Start-Sleep -Seconds 2
              
              if ($proc.HasExited) {
                  Write-Host "SSH process exited prematurely."
                  break
              }
              
              # Đọc CẢ 2 luồng (vì Pinggy in link ra stderr)
              $out = Get-Content $sshLog -Raw -ErrorAction SilentlyContinue
              $err = Get-Content $sshErr -Raw -ErrorAction SilentlyContinue
              $combined = "$out`n$err"
              
              # Tìm ID dạng tcp://xxxx.a.pinggy.link:port
              if ($combined -match 'tcp://([a-zA-Z0-9\-\.]+):(\d+)') {
                  $publicHost = $matches[1]
                  $publicPort = $matches[2]
                  break
              }
          }
          
          if ($publicHost -and $publicPort) {
              "RDP_HOST=$publicHost" >> $env:GITHUB_ENV
              "RDP_PORT=$publicPort" >> $env:GITHUB_ENV
              Write-Host "✅ Tunnel Established: $publicHost on port $publicPort"
          } else {
              Write-Host "❌ Failed to get Pinggy address. Log output:"
              Write-Host $combined
              if ($proc) { Stop-Process -Id $proc.Id -Force }
              throw "Tunnel failed. Please check the log above."
          }

      - name: Publish Connection Details (ID & PIN)
        shell: powershell
        run: |
          $summary = @(
            '## 🖥️ XyDesk Remote (RDP + Pinggy)',
            "",
            "**ID (Host):** `$env:RDP_HOST`",
            "**Port:** `$env:RDP_PORT`",
            "",
            "**Username:** `XyDesk`",
            "**PIN (Password):** `$env:RDP_PIN`",
            "",
            "**Hướng dẫn kết nối:**",
            "1. Mở app RDP (mstsc trên PC, aRDP/Microsoft Remote Desktop trên điện thoại).",
            "2. Ở ô Host/PC Name, nhập ID ở trên (VD: `$env:RDP_HOST`).",
            "3. Ở ô Port, nhập `$env:RDP_PORT`.",
            "4. Điền Username và PIN để kết nối.",
            "",
            "> ⚠️ **Lưu ý:** Pinggy miễn phí sẽ ngắt kết nối sau 60 phút. Nếu bạn cần dùng lâu dài, hãy chạy lại workflow."
          )
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Keep session alive
        shell: powershell
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] XyDesk Session Active..."
              Start-Sleep -Seconds 300
          }
