name: Main RDP Workflow

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance Number (1-10)'
        required: true
        default: '1'
        type: string

permissions:
  actions: write
  contents: read

jobs:
  deploy-rdp:
    runs-on: windows-2025
    timeout-minutes: 330

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: System Information
        shell: powershell
        run: |
          Write-Host "=== LAYER7 STORE RDP ===" -ForegroundColor Green
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsArchitecture

      - name: Enable RDP
        shell: powershell
        run: |
          Write-Host "Enabling RDP..." -ForegroundColor Green
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 1
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Write-Host "RDP enabled." -ForegroundColor Green

      - name: Create User Layer7Store
        shell: powershell
        run: |
          Write-Host "Creating user Layer7Store..." -ForegroundColor Green
          $Username = "Layer7Store"
          $Password = ConvertTo-SecureString "P@ssw0rd!" -AsPlainText -Force
          $User = Get-LocalUser -Name $Username -ErrorAction SilentlyContinue
          if ($null -eq $User) {
              New-LocalUser -Name $Username -Password $Password -PasswordNeverExpires -AccountNeverExpires -FullName "Layer7 Store"
              Write-Host "User created." -ForegroundColor Green
          } else {
              Set-LocalUser -Name $Username -Password $Password
              Write-Host "Password updated." -ForegroundColor Yellow
          }
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $Username -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member $Username -ErrorAction SilentlyContinue
          Write-Host "Username: Layer7Store" -ForegroundColor Yellow
          Write-Host "Password: P@ssw0rd!" -ForegroundColor Yellow

      - name: Install Ngrok
        shell: powershell
        run: |
          Write-Host "Downloading Ngrok..." -ForegroundColor Green
          $ngrokUrl = "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip"
          $zipPath = "$env:TEMP\ngrok.zip"
          Invoke-WebRequest -Uri $ngrokUrl -OutFile $zipPath

          Write-Host "Extracting..." -ForegroundColor Green
          Expand-Archive -Path $zipPath -DestinationPath "C:\ngrok" -Force
          Remove-Item $zipPath -Force

          $ngrokExe = "C:\ngrok\ngrok.exe"
          if (-not (Test-Path $ngrokExe)) {
              Write-Error "Ngrok not found."
              exit 1
          }

          # Add AV exclusion
          Add-MpPreference -ExclusionPath "C:\ngrok" -ErrorAction SilentlyContinue

          Write-Host "Configuring Ngrok token..." -ForegroundColor Green
          & $ngrokExe config add-authtoken $env:NGROK_AUTH_TOKEN_SAFE 2>&1 | Out-Null

          Write-Host "Ngrok installed." -ForegroundColor Green
          & $ngrokExe version
        env:
          NGROK_AUTH_TOKEN_SAFE: ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: Install Google Chrome
        shell: powershell
        run: |
          $chromeUrl = "https://dl.google.com/chrome/install/latest/chrome_installer.exe"
          $installerPath = "$env:TEMP\chrome_installer.exe"
          Invoke-WebRequest -Uri $chromeUrl -OutFile $installerPath
          Start-Process -FilePath $installerPath -ArgumentList "/silent /install" -Wait -NoNewWindow
          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue
          Write-Host "Chrome installed." -ForegroundColor Green

      - name: Install 7-Zip
        shell: powershell
        run: |
          $zipUrl = "https://www.7-zip.org/a/7z2409-x64.exe"
          $installerPath = "$env:TEMP\7z-installer.exe"
          Invoke-WebRequest -Uri $zipUrl -OutFile $installerPath
          Start-Process -FilePath $installerPath -ArgumentList "/S" -Wait -NoNewWindow
          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue
          Write-Host "7-Zip installed." -ForegroundColor Green

      # ============================================================
      # NGORK + KEEP ALIVE (gộp chung 1 step)
      # ============================================================
      - name: Ngrok Tunnel + Keep Session Alive
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          $instance      = "${{ github.event.inputs.instance_number }}"
          $repo          = "${{ github.repository }}"
          $ref           = "${{ github.ref_name }}"
          $sleepSeconds  = 60
          $triggerBackup = (Get-Date).AddMinutes(295)
          $endSession    = (Get-Date).AddMinutes(310)
          $counter       = 0
          $ngrokExe      = "C:\ngrok\ngrok.exe"
          $ngrokLog      = "$env:TEMP\ngrok.log"

          # ============================================================
          # START NGROK
          # ============================================================
          Write-Host "=== Starting Ngrok tunnel for RDP (port 3389) ===" -ForegroundColor Green

          # Kill existing ngrok
          Get-Process -Name "ngrok" -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2

          # Start ngrok with log file
          $ngrokProc = Start-Process -FilePath $ngrokExe `
              -ArgumentList "tcp 3389 --log=$ngrokLog --log-format=json" `
              -PassThru `
              -WindowStyle Hidden

          Write-Host "Ngrok started (PID: $($ngrokProc.Id))"
          Write-Host "Waiting for tunnel to establish..."
          Start-Sleep -Seconds 20

          # ============================================================
          # LẤY URL
          # ============================================================
          $publicUrl = $null
          $maxAttempts = 20

          for ($i = 1; $i -le $maxAttempts; $i++) {
              try {
                  $info = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -ErrorAction Stop
                  if ($info.tunnels.Count -gt 0) {
                      $publicUrl = $info.tunnels[0].public_url
                      Write-Host "Ngrok URL obtained: $publicUrl" -ForegroundColor Green
                      break
                  }
              } catch {
                  # Silent retry
              }
              Write-Host "Waiting for Ngrok API... ($i/$maxAttempts)"
              Start-Sleep -Seconds 3
          }

          if (-not $publicUrl) {
              Write-Host "=== NGROK LOG ===" -ForegroundColor Red
              Get-Content $ngrokLog -ErrorAction SilentlyContinue | Select-Object -Last 20
              Write-Error "Failed to get Ngrok URL after $maxAttempts attempts."
              exit 1
          }

          $hostPort = $publicUrl -replace "tcp://", ""

          # ============================================================
          # HIỂN THỊ THÔNG TIN KẾT NỐI
          # ============================================================
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "         LAYER7 STORE RDP ACCESS" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "  ADDRESS:  $hostPort" -ForegroundColor White
          Write-Host "  USERNAME: Layer7Store" -ForegroundColor White
          Write-Host "  PASSWORD: P@ssw0rd!" -ForegroundColor White
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host "  Open mstsc → Computer: $hostPort" -ForegroundColor Yellow
          Write-Host "  Username: Layer7Store / Password: P@ssw0rd!" -ForegroundColor Yellow
          Write-Host "==================================================" -ForegroundColor Cyan
          Write-Host ""

          # ============================================================
          # KEEP ALIVE LOOP
          # ============================================================
          Write-Host "=== SESSION ACTIVE ===" -ForegroundColor Green

          while ($true) {
              $counter++
              $now = Get-Date

              Write-Host ""
              Write-Host "=== Heartbeat #$counter - $now ===" -ForegroundColor Cyan
              Write-Host "RDP: $hostPort" -ForegroundColor Cyan

              # Kiểm tra ngrok còn sống
              $proc = Get-Process -Name "ngrok" -ErrorAction SilentlyContinue
              if ($null -eq $proc) {
                  Write-Host "Ngrok died! Restarting..." -ForegroundColor Red

                  $ngrokProc = Start-Process -FilePath $ngrokExe `
                      -ArgumentList "tcp 3389 --log=$ngrokLog --log-format=json" `
                      -PassThru `
                      -WindowStyle Hidden

                  Start-Sleep -Seconds 15

                  # Cập nhật URL mới
                  try {
                      $info = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels"
                      if ($info.tunnels.Count -gt 0) {
                          $publicUrl = $info.tunnels[0].public_url
                          $hostPort = $publicUrl -replace "tcp://", ""
                          Write-Host "New URL: $hostPort" -ForegroundColor Yellow
                      }
                  } catch {
                      Write-Host "Failed to get new URL" -ForegroundColor Red
                  }
              } else {
                  Write-Host "Ngrok: RUNNING (PID: $($proc.Id))" -ForegroundColor Green
              }

              # Trigger backup sau 4h55m
              if ($now -ge $triggerBackup) {
                  Write-Host ""
                  Write-Host "*** TRIGGERING BACKUP WORKFLOW ***" -ForegroundColor Yellow

                  $success = $false
                  for ($i = 1; $i -le 3; $i++) {
                      gh workflow run backup.yml --repo $repo --ref $ref -f "instance_number=$instance"
                      if ($LASTEXITCODE -eq 0) { $success = $true; break }
                      Start-Sleep -Seconds 10
                  }

                  if ($success) {
                      Write-Host "Backup triggered successfully." -ForegroundColor Green
                      $triggerBackup = (Get-Date).AddYears(1)
                  } else {
                      Write-Host "Failed to trigger backup. Retrying in 60s..." -ForegroundColor Red
                      Start-Sleep -Seconds 60
                      continue
                  }
              }

              # Kết thúc session
              if ($now -ge $endSession) {
                  Write-Host "Session ended. Cleanup..." -ForegroundColor Yellow
                  Get-Process -Name "ngrok" -ErrorAction SilentlyContinue | Stop-Process -Force
                  exit 0
              }

              Start-Sleep -Seconds $sleepSeconds
          }
