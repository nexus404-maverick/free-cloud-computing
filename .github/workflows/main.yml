name: Provision Cloud PC

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Mã đơn hàng (VD: ORD-123)'
        required: true
        type: string
      hours:
        description: 'Số giờ thuê (VD: 3)'
        required: true
        default: '3'
        type: string

permissions:
  actions: write
  contents: read

jobs:
  deploy-instance:
    runs-on: windows-2025
    timeout-minutes: 330

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      # ============================================================
      # 1. TẠO MẬT KHẨU NGẪU NHIÊN
      # ============================================================
      - name: Generate Random Password
        id: gen_pass
        shell: powershell
        run: |
          $chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
          $password = -join (1..12 | ForEach-Object { $chars[(Get-Random -Maximum $chars.Length)] })
          echo "GENERATED_PASSWORD=$password" >> $env:GITHUB_ENV

      # ============================================================
      # 2. BẬT RDP & TẠO USER
      # ============================================================
      - name: Enable RDP and Create User
        shell: powershell
        run: |
          # Bật RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 1
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          
          # Tạo User
          $Username = "Layer7Store"
          $Password = ConvertTo-SecureString "$env:GENERATED_PASSWORD" -AsPlainText -Force
          $User = Get-LocalUser -Name $Username -ErrorAction SilentlyContinue
          if ($null -eq $User) {
              New-LocalUser -Name $Username -Password $Password -PasswordNeverExpires -AccountNeverExpires -FullName "Layer7 Store"
          } else {
              Set-LocalUser -Name $Username -Password $Password
          }
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $Username -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member $Username -ErrorAction SilentlyContinue
          Write-Host "User created: $Username"

      # ============================================================
      # 3. DỌN DẸP ICON MÀN HÌNH
      # ============================================================
      - name: Clean Desktop Icons
        shell: powershell
        run: |
          Write-Host "Cleaning desktop icons..."
          
          # Xóa shortcut ngoài Desktop của User và Public
          Remove-Item -Path "C:\Users\Public\Desktop\*" -Include *.lnk, *.url -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Users\Layer7Store\Desktop\*" -Include *.lnk, *.url -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Users\runneradmin\Desktop\*" -Include *.lnk, *.url -Force -ErrorAction SilentlyContinue

          # Ẩn các icon hệ thống mặc định
          $RegPath = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\HideDesktopIcons\NewStartPanel"
          if (-not (Test-Path $RegPath)) { New-Item -Path $RegPath -Force | Out-Null }

          $HideIcons = @(
              "{645FF040-5081-101B-9F08-00AA002F954E}", # Recycle Bin
              "{20D04FE0-3AEA-1069-A2D8-08002B30309D}", # This PC
              "{F02C1A0D-BE21-4350-88B0-7367FC96EF3C}", # Network
              "{59031a47-3f72-44a7-89c5-5595fe6b30ee}", # User Files
              "{5399E694-6CE5-4D6C-8FCE-1D8870FDCBA0}"  # Control Panel
          )
          foreach ($GUID in $HideIcons) {
              Set-ItemProperty -Path $RegPath -Name $GUID -Value 1 -Type DWord -Force
          }

          Stop-Process -Name explorer -Force -ErrorAction SilentlyContinue
          Write-Host "Desktop cleaned."

      # ============================================================
      # 4. CÀI ĐẶT RUSTDESK
      # ============================================================
      - name: Install RustDesk
        shell: powershell
        timeout-minutes: 5
        run: |
          Write-Host "Downloading RustDesk..."
          $rustdeskUrl = "https://github.com/rustdesk/rustdesk/releases/download/1.3.7/rustdesk-1.3.7-x86_64.exe"
          $installer = "$env:TEMP\rustdesk.exe"
          Invoke-WebRequest -Uri $rustdeskUrl -OutFile $installer -UseBasicParsing
          
          Write-Host "Installing RustDesk..."
          Start-Process -FilePath $installer -ArgumentList "--silent-install" -WindowStyle Hidden | Out-Null
          
          $elapsed = 0
          while ($elapsed -lt 60 -and -not (Test-Path "C:\Program Files\RustDesk\rustdesk.exe")) {
              Start-Sleep -Seconds 5
              $elapsed += 5
          }
          
          & "C:\Program Files\RustDesk\rustdesk.exe" --install-service
          Start-Sleep -Seconds 10
          Start-Service -Name "RustDesk" -ErrorAction SilentlyContinue

      # ============================================================
      # 5. LẤY RUSTDESK ID (ĐÃ FIX LỖI)
      # ============================================================
      - name: Set RustDesk Password and Get ID
        shell: powershell
        timeout-minutes: 5
        run: |
          $rustdeskExe = "C:\Program Files\RustDesk\rustdesk.exe"
          
          Write-Host "Setting password: $env:GENERATED_PASSWORD"
          & $rustdeskExe --password "$env:GENERATED_PASSWORD"
          Start-Sleep -Seconds 5
          
          Write-Host "Waiting for RustDesk to generate ID..."
          Start-Sleep -Seconds 10

          $rustdeskId = $null

          # Cách 1: Dùng lệnh --get-id
          for ($i = 1; $i -le 5; $i++) {
              try {
                  $output = & $rustdeskExe --get-id 2>&1 | Out-String
                  if ($output -match "(\d{9,10})") { $rustdeskId = $matches[1]; break }
              } catch {}
              Start-Sleep -Seconds 3
          }

          # Cách 2: Đọc từ file Config
          if (-not $rustdeskId) {
              $configPaths = @(
                  "C:\Windows\ServiceProfiles\LocalService\AppData\Roaming\RustDesk\config\RustDesk.toml",
                  "C:\Windows\System32\config\systemprofile\AppData\Roaming\RustDesk\config\RustDesk.toml",
                  "C:\ProgramData\RustDesk\config\RustDesk.toml"
              )
              foreach ($path in $configPaths) {
                  if (Test-Path $path) {
                      $content = Get-Content $path -Raw -ErrorAction SilentlyContinue
                      if ($content -match 'id\s*=\s*"(\d+)"') { $rustdeskId = $matches[1]; break }
                  }
              }
          }

          # Cách 3: Đọc từ Registry
          if (-not $rustdeskId) {
              $regPaths = @("HKLM:\SOFTWARE\RustDesk", "HKCU:\SOFTWARE\RustDesk")
              foreach ($reg in $regPaths) {
                  if (Test-Path $reg) {
                      $id = (Get-ItemProperty -Path $reg -Name "ID" -ErrorAction SilentlyContinue).ID
                      if ($id) { $rustdeskId = $id; break }
                  }
              }
          }

          if ($rustdeskId) {
              Write-Host "Success! RustDesk ID: $rustdeskId"
              "RUSTDESK_ID=$rustdeskId" >> $env:GITHUB_ENV
          } else {
              Write-Error "Failed to get RustDesk ID."
              exit 1
          }

      # ============================================================
      # 6. GỬI THÔNG TIN VỀ TERMUX (WEBHOOK)
      # ============================================================
      - name: Send Credentials to Phone Server
        shell: powershell
        env:
          PHONE_SERVER_URL: ${{ secrets.PHONE_SERVER_URL }}
        run: |
          $nodeId = "${{ github.event.inputs.instance_number }}"
          
          # Xóa dấu / ở cuối URL nếu có
          $baseUrl = $env:PHONE_SERVER_URL.TrimEnd('/')
          $url = "$baseUrl/api/provision/$nodeId"
          
          $body = @{
              rustdesk_id       = "$env:RUSTDESK_ID"
              rustdesk_password = "$env:GENERATED_PASSWORD"
          } | ConvertTo-Json
          
          try {
              $res = Invoke-RestMethod -Uri $url -Method Post -Body $body -ContentType "application/json" -TimeoutSec 30
              Write-Host "Send to Termux successfully!"
          } catch {
              Write-Host "Failed to send to Termux: $_"
          }

      # ============================================================
      # 7. GIỮ PHIÊN CHẠY THEO SỐ GIỜ
      # ============================================================
      - name: Keep Session Alive
        shell: powershell
        run: |
          $hours = [int]"${{ github.event.inputs.hours }}"
          $endSession = (Get-Date).AddMinutes($hours * 60)
          
          Write-Host "Phiên làm việc sẽ kết thúc lúc: $endSession" -ForegroundColor Yellow
          
          while ((Get-Date) -lt $endSession) {
              $svc = Get-Service -Name "RustDesk" -ErrorAction SilentlyContinue
              if ($svc -and $svc.Status -ne "Running") {
                  Start-Service -Name "RustDesk" -ErrorAction SilentlyContinue
              }
              Start-Sleep -Seconds 60
          }
          Write-Host "Hết thời gian thuê. Kết thúc phiên." -ForegroundColor Red
